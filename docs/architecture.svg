<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Zone Monitor system diagram</title>
  <desc id="d">The ESP32-CAM sends to the ESP32-S3 and the servo board over ESP-NOW. The S3 sends to the servo board over ESP-NOW. The S3 and the website exchange data over HTTP. The camera also connects to the website over HTTP.</desc>
  <defs>
    <marker id="now" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4fd1c5"/></marker>
    <marker id="http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f6ad55"/></marker>
  </defs>

  <rect width="860" height="400" rx="16" fill="#12161e"/>

  <!-- ESP-NOW links -->
  <g fill="none" stroke="#4fd1c5" stroke-width="2.5" marker-end="url(#now)">
    <path d="M220 130H336"/>
    <path d="M520 130H636"/>
    <path d="M130 90V58a12 12 0 0 1 12-12H718a12 12 0 0 1 12 12V86"/>
  </g>

  <!-- HTTP links -->
  <g fill="none" stroke="#f6ad55" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#http)">
    <path d="M430 174V266" marker-start="url(#http)"/>
    <path d="M130 170V298a12 12 0 0 0 12 12H336"/>
  </g>

  <!-- Boards -->
  <g fill="#1a2029" stroke="#3a4556" stroke-width="1.5">
    <rect x="40" y="90" width="180" height="80" rx="12"/>
    <rect x="340" y="90" width="180" height="80" rx="12"/>
    <rect x="640" y="90" width="180" height="80" rx="12"/>
    <rect x="340" y="270" width="180" height="80" rx="12"/>
  </g>
  <g text-anchor="middle" fill="#eef1f6" font-size="17" font-weight="600">
    <text x="130" y="125">ESP32-CAM</text>
    <text x="430" y="125">ESP32-S3</text>
    <text x="730" y="125">ESP32</text>
    <text x="430" y="305">Website</text>
  </g>
  <g text-anchor="middle" fill="#98a2b3" font-size="14">
    <text x="130" y="148">QR reader</text>
    <text x="430" y="148">Main controller</text>
    <text x="730" y="148">Sorting servos</text>
    <text x="430" y="328">React and Express</text>
  </g>

  <!-- Legend -->
  <g font-size="14" fill="#eef1f6">
    <path d="M590 290H630" stroke="#4fd1c5" stroke-width="2.5"/>
    <text x="642" y="295">ESP-NOW (direct)</text>
    <path d="M590 322H630" stroke="#f6ad55" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="642" y="327">HTTP (over Wi-Fi)</text>
  </g>
</svg>
