<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Zone Monitor: QR-labelled parcel on a conveyor belt</title>
  <style>
    /* At tab size the finest parts would only blur, so they are left out. */
    @media (max-width: 24px) { .fine { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2430"/>
      <stop offset="1" stop-color="#0c0f15"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9b868"/>
      <stop offset="1" stop-color="#e8933a"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe3d8"/>
      <stop offset="1" stop-color="#2a9d92"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Motion lines -->
  <g class="fine" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round">
    <path d="M5 22h7" opacity="0.9"/>
    <path d="M3 29h9" opacity="0.6"/>
    <path d="M6 36h6" opacity="0.35"/>
  </g>

  <!-- Legs -->
  <g class="fine" fill="#3a4556">
    <rect x="14" y="53" width="4" height="7"/>
    <rect x="46" y="53" width="4" height="7"/>
    <rect x="11" y="58.5" width="10" height="2" rx="1"/>
    <rect x="43" y="58.5" width="10" height="2" rx="1"/>
  </g>

  <!-- Parcel -->
  <path d="M15 17 23 8h26l-8 9z" fill="#ffd08f"/>
  <path d="M41 17l8-9v25l-8 10z" fill="#bf7426"/>
  <rect x="15" y="17" width="26" height="26" fill="url(#front)"/>
  <path d="M25 17l8-9h6l-8 9z" fill="#a9651f"/>
  <rect x="25" y="17" width="6" height="8" fill="#a9651f"/>
  <path class="fine" d="M15 17h26" stroke="#ffe3bd" stroke-width="0.8"/>

  <!-- Shipping label with a small QR code -->
  <rect x="17.5" y="27.5" width="13" height="13" rx="1" fill="#fff"/>
  <g fill="#12161e">
    <rect x="19" y="29" width="4" height="4"/>
    <rect x="25" y="29" width="4" height="4"/>
    <rect x="19" y="35" width="4" height="4"/>
    <g class="fine">
      <rect x="25" y="35" width="1.5" height="1.5"/>
      <rect x="27.5" y="35" width="1.5" height="1.5"/>
      <rect x="26.2" y="36.6" width="1.4" height="1.4"/>
      <rect x="25" y="37.6" width="1.4" height="1.4"/>
      <rect x="27.6" y="37.6" width="1.4" height="1.4"/>
    </g>
  </g>
  <g class="fine" fill="#fff">
    <rect x="20" y="30" width="2" height="2"/>
    <rect x="26" y="30" width="2" height="2"/>
    <rect x="20" y="36" width="2" height="2"/>
  </g>
  <g class="fine" fill="#12161e">
    <rect x="20.6" y="30.6" width="0.8" height="0.8"/>
    <rect x="26.6" y="30.6" width="0.8" height="0.8"/>
    <rect x="20.6" y="36.6" width="0.8" height="0.8"/>
  </g>

  <!-- This way up -->
  <g class="fine" fill="none" stroke="#8a4f12" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35.5 39v-8M33 33.4l2.5-2.6 2.5 2.6"/>
    <path d="M33 22.5h5" opacity="0.8"/>
    <path d="M33 25.5h5" opacity="0.8"/>
  </g>

  <!-- Conveyor -->
  <rect x="4" y="43" width="56" height="12" rx="6" fill="url(#belt)"/>
  <rect class="fine" x="9" y="44.2" width="46" height="1.3" rx="0.65" fill="#c9f8f2" opacity="0.85"/>
  <g fill="#12161e">
    <circle cx="13" cy="49.5" r="3.4"/>
    <circle cx="25" cy="49.5" r="3.4"/>
    <circle cx="39" cy="49.5" r="3.4"/>
    <circle cx="51" cy="49.5" r="3.4"/>
  </g>
  <g class="fine" fill="#98a2b3">
    <circle cx="13" cy="49.5" r="1.3"/>
    <circle cx="25" cy="49.5" r="1.3"/>
    <circle cx="39" cy="49.5" r="1.3"/>
    <circle cx="51" cy="49.5" r="1.3"/>
  </g>
</svg>
